# ══════════════════════════════════════════════
#  tmux 配置 — WSL2 + Neovim 优化
# ══════════════════════════════════════════════
# macOS (iTerm2) 注意：本配置大量使用 Alt(Meta) 键，
# 需在 iTerm2 中设置 Profiles → Keys → Left Option key → "Esc+"
# 否则所有 M- 开头的快捷键都不会生效。

# ── 前缀键 ──────────────────────────────────
unbind C-b
set -g prefix M-b
bind M-b send-prefix

# ── 终端与颜色 ──────────────────────────────
set -g default-terminal "tmux-256color"
# 预声明外层终端特性，减少 tmux 对终端的探测查询
# （SSH 延迟下查询响应会泄露为乱码，如 DA1/DA2/OSC11 响应）
set -as terminal-features ",xterm-256color:RGB:clipboard:focus:title:ccolour:cstyle:strikethrough:overline:usstyle"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ── Shell（按平台自动选择） ─────────────────
if-shell "uname | grep -q Darwin" \
  "set -g default-shell /bin/zsh" \
  "set -g default-shell /usr/bin/zsh"

# ── Neovim 兼容 ─────────────────────────────
# SSH 延迟下需更大 escape-time 避免转义序列被截断
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -sg escape-time 50' \
  'set -sg escape-time 10'
set -g focus-events on

# ── 剪贴板（按平台自动选择） ────────────────
set -s set-clipboard on
# SSH 下禁用 passthrough 避免查询泄露，本地保持开启（yazi 图片预览需要）
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -g allow-passthrough off' \
  'set -g allow-passthrough on'
if-shell "uname | grep -q Darwin" \
  "set -s copy-command 'pbcopy'" \
  "set -s copy-command 'xclip -selection clipboard -i'"

# ── 通用设置 ────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top

# ── Pane 导航（Alt-hjkl，无需前缀） ────────
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ── Pane 大小调整（Alt-Shift-hjkl，无需前缀）
bind -n -r M-H resize-pane -L 5
bind -n -r M-J resize-pane -D 5
bind -n -r M-K resize-pane -U 5
bind -n -r M-L resize-pane -R 5

# ── 分屏（保留当前目录，无需前缀） ─────────
bind -n M-I split-window -h -c "#{pane_current_path}"
bind -n M-V split-window -v -c "#{pane_current_path}"

# ── 窗口管理（无需前缀） ───────────────────
bind -n M-n previous-window
bind -n M-m next-window
bind -n M-T new-window -c "#{pane_current_path}"
bind -n M-W if-shell "[ #{window_panes} -eq 1 ] && [ #{session_windows} -eq 1 ]" \
  "confirm-before -p '最后一个面板，退出 tmux？(y/n)' kill-session" \
  "kill-pane"
bind -n M-Q confirm-before -p "退出 tmux？(y/n)" kill-session
bind -n M-B detach-client

# ── 快捷操作 ────────────────────────────────
bind r source-file ~/.tmux.conf \; display "配置已重载！"

# ── Vi 复制模式 ─────────────────────────────
setw -g mode-keys vi
set -g status-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi r send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel
bind P paste-buffer

# 滚轮滚动速度：每次 1 行（默认 5 行太快）
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

# 复制模式剪贴板（按平台自动选择）
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'; \
   bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'; \
   bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear 'pbcopy'" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -i'; \
   bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -i'; \
   bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear 'xclip -selection clipboard -i'"

# ── 插件（TPM） ─────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# tmux-yank：鼠标拖选后保留选区（不自动退出 copy mode）
set -g @yank_action 'copy-pipe-no-clear'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin '2kabhishek/tmux2k'
set -g @plugin 'fcsonline/tmux-thumbs'

# resurrect / continuum 配置
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux2k 配置
set -g @tmux2k-theme 'default-icons'
set -g @tmux2k-left-plugins "session git cwd"
# macOS 不显示 host（本机无需），远程 Linux 显示
if-shell "uname | grep -q Darwin" \
  "set -g @tmux2k-right-plugins 'cpu ram network time'" \
  "set -g @tmux2k-right-plugins 'host cpu ram network time'"
set -g @tmux2k-host-colors "light_purple text"
set -g @tmux2k-refresh-rate 5

# tmux-thumbs 配置
set -g @thumbs-key F                              # 保留前缀触发作为备用
if-shell "uname | grep -q Darwin" \
  "set -g @thumbs-command 'echo -n {} | pbcopy && tmux display-message \"已复制: {}\"'" \
  "set -g @thumbs-command 'echo -n {} | xclip -selection clipboard -i && tmux display-message \"已复制: {}\"'"
if-shell "uname | grep -q Darwin" \
  "set -g @thumbs-upcase-command 'echo -n {} | pbcopy && tmux new-window -n open \"open {}\"'" \
  "set -g @thumbs-upcase-command 'echo -n {} | xclip -selection clipboard -i && tmux display-message \"已复制: {}\"'"
set -g @thumbs-unique enabled                     # 去重相同文本
set -g @thumbs-position off_left                  # 标签显示在匹配文本左侧
set -g @thumbs-contrast 1                         # 高对比度标签
set -g @thumbs-hint-fg-color yellow               # 标签颜色醒目
set -g @thumbs-hint-bg-color black
set -g @thumbs-select-fg-color green              # 选中后颜色
set -g @thumbs-regexp-1 '[a-f0-9]{7,40}'          # git short/full hash
set -g @thumbs-regexp-2 '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(?::[0-9]+)?' # IP:port

# 自动安装 TPM
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# 初始化 TPM（必须放在最后）
run '~/.tmux/plugins/tpm/tpm'

# TPM 初始化后：部署自定义 tmux2k 插件（TPM 更新后自愈）
run 'SRC="$(dirname "$(readlink ~/.tmux.conf 2>/dev/null || echo ~/.tmux.conf)")/tmux2k-custom"; \
     DST="$HOME/.tmux/plugins/tmux2k/plugins"; \
     [ -d "$SRC" ] && [ -d "$DST" ] && cp "$SRC"/*.sh "$DST/" 2>/dev/null; true'

# TPM 初始化后绑定（避免被插件覆盖）
bind -n M-f run-shell -b ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.sh
