# ══════════════════════════════════════════════
#  tmux 配置 — WSL2 + Neovim 优化
# ══════════════════════════════════════════════
# macOS (iTerm2) 注意：本配置大量使用 Alt(Meta) 键，
# 需在 iTerm2 中设置 Profiles → Keys → Left Option key → "Esc+"
# 否则所有 M- 开头的快捷键都不会生效。

# ── 前缀键 ──────────────────────────────────
unbind C-b
set -g prefix M-b
bind M-b send-prefix

# ── 终端与颜色 ──────────────────────────────
set -g default-terminal "tmux-256color"

# Claude Code 推荐：扩展键序列（Shift+Enter / Ctrl+组合键等可正确透传）
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -ga terminal-overrides ',*:Tc'

# ── Shell（按平台自动选择） ─────────────────
if-shell "uname | grep -q Darwin" \
  "set -g default-shell /bin/zsh" \
  "set -g default-shell /usr/bin/zsh"

# ── Neovim 兼容 ─────────────────────────────
# SSH 延迟下需更大 escape-time 避免转义序列被截断
# 本地用 10 而非 0：0 可能截断真实转义序列（nvim 官方建议小而非零）
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -sg escape-time 50' \
  'set -sg escape-time 10'
set -g focus-events on

# ── 剪贴板（按平台自动选择） ────────────────
set -s set-clipboard on
set -g allow-passthrough on
# 复制命令：macOS→pbcopy，其余 Linux→xclip
if-shell "uname | grep -q Darwin" \
  "set -s copy-command 'pbcopy'" \
  "set -s copy-command 'xclip -selection clipboard -i'"
# WSL：用 win32yank.exe 桥接 Windows 剪贴板（在上面 Linux 默认之后覆盖）
# copy-command 值不经 shell 存储，复制时才交给 sh 执行，$HOME 届时展开
if-shell "grep -qiE '(microsoft|WSL)' /proc/version 2>/dev/null" \
  "set -s copy-command '$HOME/.config/nvim/bin/win32yank.exe -i --crlf'"

# ── 通用设置 ────────────────────────────────
set -g mouse on
set -g history-limit 100000
set -g display-time 4000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top
# 显式声明默认值：会话销毁时客户端退出（scratch popup 里 Ctrl+D 直接关弹窗）。
# 若为 off，popup 客户端会切到 main 造成套娃；显式写出避免重载残留旧值
set -g detach-on-destroy on
# 终端标题显示「会话名:窗口名」（Windows Terminal 标签页可辨识）
set -g set-titles on
set -g set-titles-string "#S:#W"
# 命令提示符（prefix :）历史持久化（server 级选项，用 -s）
set -s history-file ~/.tmux_history

# ── Pane 导航（Alt-hjkl，无需前缀） ────────
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane 缩放与会话切换（无需前缀）
bind -n M-z resize-pane -Z
bind -n M-s choose-tree -Zs

# ── Pane 大小调整（Alt-Shift-hjkl，无需前缀）
# -r（repeat）只对前缀表有意义，root 表绑定本身就可连按，故不加
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# ── 分屏（保留当前目录，无需前缀） ─────────
bind -n M-I split-window -h -c "#{pane_current_path}"
bind -n M-V split-window -v -c "#{pane_current_path}"

# ── 窗口管理（无需前缀） ───────────────────
bind -n M-n previous-window
bind -n M-m next-window
bind -n M-T new-window -c "#{pane_current_path}"
bind -n M-W if-shell "[ #{window_panes} -eq 1 ] && [ #{session_windows} -eq 1 ]" \
  "confirm-before -p '最后一个面板，退出 tmux？(y/n)' kill-session" \
  "kill-pane"
bind -n M-Q confirm-before -p "退出 tmux？(y/n)" kill-session
bind -n M-B detach-client

# ── 浮动终端（Alt-\） ──────────────────────
# popup 内：detach 关闭（再按可重新打开，保留会话）
# 其他：打开/恢复名为 scratch 的 popup 会话
bind -n M-\\ if-shell -F '#{==:#{session_name},scratch}' {
    detach-client
} {
    display-popup -d '#{pane_current_path}' -w 80% -h 80% -E 'tmux attach -t scratch 2>/dev/null || tmux new -s scratch'
}

# ── lazygit 浮动窗口（Alt-g） ──────────────
bind -n M-g if-shell "command -v lazygit" \
  "display-popup -d '#{pane_current_path}' -w 90% -h 90% -E lazygit" \
  "display-message 'lazygit 未安装'"

# ── 快捷操作 ────────────────────────────────
bind r source-file ~/.tmux.conf \; display "配置已重载！"

# ── Vi 复制模式 ─────────────────────────────
setw -g mode-keys vi
set -g status-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi r send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel
# P：粘贴。WSL 从 Windows 剪贴板拉取，其余平台用 tmux 自身 buffer（与上面 copy-command 同一套 WSL 判断）
if-shell "grep -qiE '(microsoft|WSL)' /proc/version 2>/dev/null" \
  'bind P run-shell "$HOME/.config/nvim/bin/win32yank.exe -o --lf | tmux load-buffer - && tmux paste-buffer"' \
  'bind P paste-buffer'

# 滚轮滚动速度：每次 3 行（默认 5 行太快）
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down

# 复制模式：y / Enter / 鼠标释放 → 复制并退出（走上面的 copy-command 到系统剪贴板）
bind -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
# 防御：清除 tmux-yank 旧 server 可能遗留的 MouseDown1Pane→cancel 绑定（新 server 冗余但无害）
unbind -T copy-mode-vi MouseDown1Pane

# ── 插件（TPM） ─────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin '2kabhishek/tmux2k'
set -g @plugin 'fcsonline/tmux-thumbs'

# resurrect / continuum 配置
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux2k 配置
set -g @tmux2k-theme 'default-icons'
# 不放 git 插件：每次刷新都会在 cwd 跑 git 命令，大仓库/WSL2 下是常驻开销
set -g @tmux2k-left-plugins "session cwd"
# macOS 不显示 host（本机无需），远程 Linux 显示
if-shell "uname | grep -q Darwin" \
  "set -g @tmux2k-right-plugins 'cpu ram network time'" \
  "set -g @tmux2k-right-plugins 'host cpu ram'"
set -g @tmux2k-host-colors "light_purple text"
set -g @tmux2k-refresh-rate 10

# tmux-thumbs 配置
set -g @thumbs-key F
# 选中文本用双引号包住，避免含空格/分号等字符时被 shell 拆词
if-shell "uname | grep -q Darwin" \
  "set -g @thumbs-command 'printf %s \"{}\" | pbcopy && tmux display-message \"已复制\"'" \
  "set -g @thumbs-command 'printf %s \"{}\" | xclip -selection clipboard -i && tmux display-message \"已复制\"'"
if-shell "uname | grep -q Darwin" \
  "set -g @thumbs-upcase-command 'printf %s \"{}\" | pbcopy && tmux new-window -n open open \"{}\"'" \
  "set -g @thumbs-upcase-command 'xdg-open \"{}\" >/dev/null 2>&1 || wslview \"{}\"'"
set -g @thumbs-unique enabled
set -g @thumbs-position off_left
set -g @thumbs-contrast 1
set -g @thumbs-hint-fg-color yellow
set -g @thumbs-hint-bg-color black
set -g @thumbs-select-fg-color green
set -g @thumbs-regexp-1 '[a-f0-9]{7,40}'                                            # git hash
set -g @thumbs-regexp-2 '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(?::[0-9]+)?' # IP(:port)

# 自动安装 TPM
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# 初始化 TPM（必须放在最后）
run '~/.tmux/plugins/tpm/tpm'

# TPM 初始化后：部署自定义 tmux2k 插件（TPM 更新后自愈）
run 'SRC="$(dirname "$(readlink ~/.tmux.conf 2>/dev/null || echo ~/.tmux.conf)")/tmux2k-custom"; \
     DST="$HOME/.tmux/plugins/tmux2k/plugins"; \
     [ -d "$SRC" ] && [ -d "$DST" ] && cp "$SRC"/*.sh "$DST/" 2>/dev/null; true'

# TPM 初始化后绑定（避免被插件覆盖）
bind -n M-f run-shell -b ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.sh
